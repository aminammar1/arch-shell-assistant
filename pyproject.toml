[project]
name = "arch-shell-assistant"
version = "0.1.0"
description = "Safe plain-language to shell-command agent for Arch Linux: explains, rates risk, confirms before running"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Mohamed Amine Ammar", email = "ammar.mohamdamine@gmail.com" }
]
keywords = ["arch-linux", "cli", "shell", "ai-agent", "pacman", "groq"]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.99.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
arch-shell-assistant = "alien_x.main:main"
alien-x = "alien_x.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alien_x"]
